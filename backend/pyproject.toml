[project]
name = "atfi-memnu-backend"
version = "0.8.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "tokenizers>=0.23.2",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0,<2",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[tool.pyright]
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/build",
    "**/dist",
    "training/scripts",
    "tests",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
