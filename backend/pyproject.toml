[project]
name = "atfi-memnu-backend"
version = "0.8.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.2",
    "tokenizers>=0.23.1",
    "numpy>=2.5.1",
    "onnxruntime>=1.27.0,<2",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.5",
    "urllib3>=2.7.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[tool.pyright]
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/build",
    "**/dist",
    "training/scripts",
    "tests",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
